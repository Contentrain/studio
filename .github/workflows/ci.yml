name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Proves the single migration lineage stands up on plain Postgres
  # (Supabase-free): auth shim + 001..N apply cleanly, the signup bootstrap
  # trigger chain fires, and RLS isolates rows under the request.jwt.claim.sub
  # GUC contract. Guards the managed (postgres) deployment pair.
  postgres-lineage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NUXT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The lineage scripts only need the `pg` driver — skip postinstall
      # (nuxt prepare etc.) to keep this job fast.
      - run: pnpm install --ignore-scripts

      - name: Apply migration lineage to plain Postgres
        run: node scripts/migrate-postgres.mjs

      - name: Verify managed schema (roles, shim, bootstrap chain, RLS)
        run: node scripts/verify-managed-schema.mjs

      - name: Contract tests (postgres DatabaseProvider)
        run: pnpm test:contract
        env:
          CONTRACT_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Generate Contentrain client
        run: npx contentrain generate

      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck

      - name: Start local Supabase DB
        run: pnpm dlx supabase start --yes --workdir . --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Test
        run: pnpm test:ci

      - name: Test RLS
        run: pnpm test:rls

      - name: Install Playwright browsers
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
