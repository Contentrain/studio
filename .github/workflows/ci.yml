name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the run in flight irrelevant; letting it finish
# only holds a runner. Pushes to main are never cancelled — a superseded run
# there is still the record of what that commit did.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Proves the single migration lineage stands up on plain Postgres
  # (Supabase-free): auth shim + 001..N apply cleanly, the signup bootstrap
  # trigger chain fires, and RLS isolates rows under the request.jwt.claim.sub
  # GUC contract. Guards the managed (postgres) deployment pair.
  postgres-lineage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NUXT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The lineage scripts only need the `pg` driver — skip postinstall
      # (nuxt prepare etc.) to keep this job fast.
      - run: pnpm install --ignore-scripts

      - name: Apply migration lineage to plain Postgres
        run: node scripts/migrate-postgres.mjs

      - name: Verify managed schema (roles, shim, bootstrap chain, RLS)
        run: node scripts/verify-managed-schema.mjs

      - name: Contract tests (postgres DatabaseProvider)
        run: pnpm test:contract
        env:
          CONTRACT_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Same vitest RLS suite the Supabase job runs — here against the plain
      # Postgres service, proving row isolation on the managed pair too.
      # (psql ships preinstalled on ubuntu-latest runners.)
      - name: RLS tests (plain Postgres)
        run: pnpm test:rls
        env:
          RLS_DB_URL: postgres://postgres:postgres@localhost:5432/postgres

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Generate Contentrain client
        run: pnpm exec contentrain-query generate

      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck

      - name: Start local Supabase DB
        run: pnpm dlx supabase start --yes --workdir . --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Test
        run: pnpm test:ci

      - name: Test RLS
        run: pnpm test:rls

      # Two network-bound things used to happen here on every run: the
      # Chromium download, and `--with-deps` shelling out to apt for system
      # libraries `ubuntu-latest` already ships. Together they took 3 minutes
      # on a good day and 45 on a bad one — a 15x swing with no code change,
      # and the longest step in the job either way.
      #
      # The browser is cached against the lockfile, so it is re-downloaded
      # only when the playwright-core version actually moves. On a hit the
      # install is skipped outright: the binary is there, and the system
      # libraries come from the runner image rather than from apt.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
