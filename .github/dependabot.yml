version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Contentrain ecosystem packages move in lockstep (mcp/query pin an exact
      # @contentrain/types), so a bump must land as ONE reviewable PR — never
      # split across three separate dependabot PRs that each break the type peer.
      contentrain:
        patterns:
          - "@contentrain/*"
      nuxt:
        patterns:
          - nuxt
          - "@nuxt/*"
      vue:
        patterns:
          - vue
          - vue-router
          - "@vue/*"
          - radix-vue
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@nuxt/test-utils"
          - "@vue/test-utils"
          - playwright-core
          - happy-dom
      linting:
        patterns:
          - eslint
          - "@nuxt/eslint"
          - "@commitlint/*"
          - lint-staged
          - husky
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
